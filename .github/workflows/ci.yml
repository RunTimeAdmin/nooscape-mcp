# Type check, test and build the package, and list what npm would publish. It runs on every pull request and on main.
# Actions are pinned to a full commit, as the Nooscape repository does.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      # What `npm publish` would ship. The `files` list in package.json decides it, and the metadata test pins that list.
      - name: Package contents
        run: npm pack --dry-run

      # Advisory: a new upstream advisory should be seen, but must not block an unrelated merge.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod
        continue-on-error: true
